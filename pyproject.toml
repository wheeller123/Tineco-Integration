[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component defines ``hass`` as an async fixture
# but ``enable_custom_integrations`` (which consumes it) is sync. In
# pytest-asyncio's default STRICT mode the sync consumer receives an
# unawaited async_generator and trips
# ``AttributeError: 'async_generator' object has no attribute 'data'``.
# Auto mode lets pytest-asyncio bridge async fixtures into sync consumers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E + F only, stated explicitly rather than left to ruff's defaults. Existing
# custom_components/tineco code wasn't written against the SIM/B rulesets;
# enforcing those would mean a code-style PR independent of
# regression-prevention work.
#
# This was implicit until ruff 0.16.0 (2026-07-23) widened its default rule set
# to ~415 rules (BLE/UP/DTZ/RUF/SIM/B/...), which turned the nightly Validate
# run red on an unchanged tree with 190 new errors. Keep this select list
# explicit so a future ruff release can't silently change what CI enforces.
select = ["E", "F"]
ignore = ["E501"]  # line length handled by formatter, not lint
