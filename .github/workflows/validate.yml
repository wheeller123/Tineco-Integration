name: Validate

on:
  push:           # run on every push to any branch
  pull_request:
  workflow_dispatch:
  schedule:
  - cron:  '0 0 * * *'

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check custom_components/tineco

  release-consistency:
    # Guardrail (lessons learned): keep manifest version / repo URLs /
    # README version / CHANGELOG in sync on every push & PR, so the next
    # release can't ship a version mismatch or broken HACS links.
    name: Release Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check release consistency
        run: python scripts/check_release_consistency.py
